<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 106" width="960" height="106" fill="none" stroke="currentColor" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
  <title>Opening a deep link on the pre-rendered site</title>
  <defs>
    <marker id="dl-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="currentColor" stroke="none"/>
    </marker>
  </defs>

  <g stroke-width="1.5">
    <rect x="0" y="2" width="190" height="72" rx="4"/>
    <rect x="256" y="2" width="190" height="72" rx="4"/>
    <rect x="512" y="2" width="190" height="72" rx="4"/>
    <rect x="768" y="2" width="190" height="72" rx="4"/>
    <path d="M190 38 H252" marker-end="url(#dl-arrow)"/>
    <path d="M446 38 H508" marker-end="url(#dl-arrow)"/>
    <path d="M702 38 H764" marker-end="url(#dl-arrow)"/>
  </g>
  <g fill="currentColor" stroke="none" text-anchor="middle">
    <text x="95" y="32">GET</text>
    <text x="95" y="52">/characters/king-halo</text>
    <text x="351" y="32">characters/king-halo.html</text>
    <text x="351" y="52" font-weight="700">status 200</text>
    <text x="607" y="32">Content and its data</text>
    <text x="607" y="52">are already in the HTML</text>
    <text x="863" y="32">App takes over; stale</text>
    <text x="863" y="52">data refreshes quietly</text>
  </g>
  <text x="0" y="100" fill="currentColor" stroke="none" opacity="0.75">Old ?id= links still work: they load characters.html, which redirects to the slug address.</text>
</svg>
