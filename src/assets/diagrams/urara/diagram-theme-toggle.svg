<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" width="960" height="360" fill="none" stroke="currentColor" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="14">
  <title>Theme toggle: the reveal I wanted and the one that ships</title>

  <!-- Left: staircase via clip-path -->
  <text x="0" y="22" fill="currentColor" stroke="none" font-weight="700" font-size="15">Wanted: staircase edge</text>
  <rect x="0" y="40" width="440" height="240" stroke-width="1.5"/>
  <path d="M0 40 H250 V70 H190 V100 H300 V130 H140 V160 H220 V190 H110 V220 H260 V250 H170 V280 H0 Z" fill="currentColor" fill-opacity="0.18" stroke="none"/>
  <g stroke-width="5">
    <path d="M250 40 V70"/><path d="M190 70 V100"/><path d="M300 100 V130"/><path d="M140 130 V160"/>
    <path d="M220 160 V190"/><path d="M110 190 V220"/><path d="M260 220 V250"/><path d="M170 250 V280"/>
  </g>
  <g fill="currentColor" stroke="none">
    <text x="0" y="306">clip-path polygon on the new page snapshot, 40 keyframes</text>
    <text x="0" y="326" opacity="0.75">Runs off the main thread in Chrome 157, but the full-screen</text>
    <text x="0" y="346" opacity="0.75">mask is redrawn every frame. On a 4K screen it fell behind.</text>
  </g>

  <!-- Right: straight edge via transforms -->
  <text x="520" y="22" fill="currentColor" stroke="none" font-weight="700" font-size="15">Ships: straight edge</text>
  <rect x="520" y="40" width="440" height="240" stroke-width="1.5"/>
  <rect x="520" y="40" width="190" height="240" fill="currentColor" fill-opacity="0.18" stroke="none"/>
  <path d="M710 40 V280" stroke-width="1.5" stroke-dasharray="5 4"/>
  <g stroke-width="5">
    <path d="M790 40 V70"/><path d="M750 70 V100"/><path d="M820 100 V130"/><path d="M735 130 V160"/>
    <path d="M800 160 V190"/><path d="M725 190 V220"/><path d="M770 220 V250"/><path d="M745 250 V280"/>
  </g>
  <g stroke-width="1" opacity="0.6">
    <path d="M710 55 H790"/><path d="M710 85 H750"/><path d="M710 115 H820"/><path d="M710 145 H735"/>
    <path d="M710 175 H800"/><path d="M710 205 H725"/><path d="M710 235 H770"/><path d="M710 265 H745"/>
  </g>
  <g fill="currentColor" stroke="none">
    <text x="520" y="306">Old page in its own group that slides right while its</text>
    <text x="520" y="326">image slides left: a moving window. Lanes race ahead.</text>
    <text x="520" y="346" opacity="0.75">Transforms only, so the GPU does it all. Smooth at 4K.</text>
  </g>
  <g fill="currentColor" stroke="none" font-size="12" opacity="0.8">
    <text x="530" y="60">new theme</text>
    <text x="880" y="60">old theme</text>
  </g>
</svg>
